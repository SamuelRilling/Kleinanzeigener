# Kleinanzeigen search settings. Edit, save, then double-click launch.bat
# (or run: python deals.py). Every run writes to runs/<date_time>/.

[location]
home_zip = "78628"
local_radius_km = 30          # listings within this radius are marked "local" (easy pickup); not a filter

[budget]                      # effective price = ask (VB: minus haggle) + fixes (Target.md §5)
limit_eur = 700               # hard limit
target_eur = 600              # tier 0-2 deals at or below this get "act_fast"
stretch_eur = 75              # tier 0-1 (very good) deals may go this far over the limit
am4_max_eur = 550             # cap for AM4 + 64 GB builds (tier 4)
vb_discount = 0.10            # expected haggle on "VB" listings (0.05-0.15)
special_max_eur = 800         # §6.3 special cases: budget price + GPU fix must stay under this
price_basis = "effective"     # price the limits are judged on: "effective" (VB haggle + confirmed fixes)
                              # or "list" (the asking price as listed). Both are shown either way

[rules]                       # what gets discarded (Target.md §2). Changes from the Brief are listed in every report
am4_min_ram_gb = 32           # DDR4 platforms (AM4, DDR4 Intel) need at least this much RAM (Brief: AM4 64).
                              # AM4 under 64 GB passes as tier 5 (ranked last). One of 16, 32, 48, 64
min_vram_gb = 12              # smallest GPU VRAM kept (Brief: 12)
allow_intel = true            # Intel judged case by case (Brief: reject all). 10th gen and older rejected;
                              # no AVX-512 counts only while the model spills to the CPU, the dead socket
                              # only under a CPU that is not already strong. None: tier as AM5, one: 4, both: 5
allow_arc = false             # Intel Arc GPUs (Brief: reject; Strata supports them on Linux only)
allow_apu_x4 = false          # Ryzen 8500G/8300G (Brief: reject; GPU at PCIe 4.0 x4)
allow_sff = false             # Mini-ITX / small cases (Brief: reject)
allow_oem = false             # Dell/HP/Lenovo/... prebuilts (Brief: reject; proprietary parts)
allow_mini_pc = false         # mini-PCs and handhelds (no GPU slot)
pickup_only = "keep"          # "Nur Abholung / kein Versand": "keep" (flag only), "local_only", or "drop"
misprice_share = 0.5          # ask below this share of what its GPU + RAM alone are worth = mispriced (0 = off)
scam_signals_drop = 2         # this many scam signals drop a listing

[fixes]                       # € added to the price for missing parts (Target.md §5), only when the listing
                              # confirms the part is missing or weak; unmentioned parts are flagged instead
psu_min_w = 650               # a stated PSU under this is a counted fix (Brief: 750)
psu_min_24gb_w = 850          # the same for a 24 GB card
psu_eur = 95                  # 750 W Gold PSU
psu_24gb_eur = 120            # 850 W Gold, for a 24 GB card
cooler_eur = 30               # tower cooler for a 105 W+ CPU
ssd_eur = 90                  # 1 TB NVMe
gpu_eur = 220                 # used RTX 3060 12 GB (bundles, special cases)
case_eur = 65                 # airflow case (bundles only)

[search]
category = "PCs"              # Elektronik > PCs
ask_min_eur = 400             # asking price range searched
ask_max_eur = 850             # above the limit on purpose: VB haggling and stretch deals
sort = "DATE_DESCENDING"      # newest first
pages_per_term = 100          # 30 ads per page
max_requests = 3000           # search requests per run, all terms together
max_details = 2000            # full listing fetches per run, best-ranked first
delay_s = 0.3                 # pause between requests (be polite to the site)
full_text_all = true          # read the full text of every listing, so any rule can be changed later offline
reuse_days = 7                # reuse saved full text of an unchanged listing up to this age (0 = always fetch)
# Matched against title + description. GPUs (8 GB twins included: the parser decides the VRAM),
# AM5 words, and big RAM.
terms = [
    "3060", "4060 Ti", "5060 Ti", "4070", "5070", "3080", "3090", "4080", "5080", "4090",
    "6700 XT", "6750 XT", "6800", "6900 XT", "6950 XT", "7600 XT", "7700 XT", "7800 XT", "7900",
    "9060 XT", "9070",
    "AM5", "DDR5", "B650", "X670", "B850", "X870", "A620",
    "7600", "7600X", "9600X", "7700X", "9700X", "7800X3D", "9800X3D", "8700G",
    "64GB", "64 GB", "2x32",
]
# Searched last (after bundles): many listings only say "PC" in the title and list the parts in
# the text, which is read in full. They match the most listings, so the request cap cuts them first.
broad_terms = [
    "PC", "Gaming PC", "Gamer PC", "Spiele PC", "Zocker PC", "Rechner", "Gaming Rechner", "Computer",
    "Gaming Computer", "Personal Computer", "Desktop PC", "Tower PC", "Komplett PC", "Komplettsystem",
    "Workstation", "Selbstbau PC",
]

[bundles]                     # Priming §5.1 secondary track: AM5 CPU + board + RAM, GPU bought separately
enabled = true
category = "PC-Zubehör & Software"
terms = ["Aufrüstkit", "Aufrüstset", "Aufrüst PC", "Bundle AM5", "AM5 Bundle", "B650 Bundle", "DDR5 Bundle"]

[prices]                      # fair-price check: an agent fills prices.toml by hand (prompts/price_calibration.md)
file = "prices.toml"          # used € per GPU / CPU / RAM / board, in the names of each run's components.csv
underpriced_pct = 15          # ask this % below the fair price: flagged underpriced (a likely good deal)
overpriced_pct = 20           # ask this % above it: flagged overpriced. Flags only, nothing is dropped

[ai]
prompt = "prompts/ai_pass.md"   # static instructions put at the top of every ai_prompt.md
attach = ["Target.md"]          # appended after the instructions: the rules the AI judges by
